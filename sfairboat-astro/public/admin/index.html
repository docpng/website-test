<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Site Editor | South Florida Airboat Adventures</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <!-- Sveltia CMS reads its settings from ./config.yml. The login and site
         links follow whichever domain the editor is opened on, so it works on
         the test domain and the live domain without changes. -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/@sveltia/cms@0/dist/sveltia-cms.js"></script>
    <!-- "Photo" and "Video" buttons in text fields, and live page preview -->
    <script src="./components.js"></script>
    <script src="./preview.js"></script>
    <script>
      CMS.init({
        config: {
          backend: { base_url: location.origin },
          site_url: location.origin,
          display_url: location.origin,
        },
      });
    </script>
    <!-- Link to Arrange mode (drag and drop photos/videos on the real pages) -->
    <a
      href="/admin/arrange/"
      style="position: fixed; left: 12px; bottom: 12px; z-index: 1000; background: #142319; color: #fff; padding: 7px 12px; border-radius: 4px; font: 13px system-ui, sans-serif; text-decoration: none; box-shadow: 0 2px 6px rgba(0,0,0,.25);"
      >Arrange pages</a
    >
  </body>
</html>
