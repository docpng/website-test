<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Site Editor | South Florida Airboat Adventures</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <!-- Sveltia CMS reads its settings from ./config.yml. The login and site
         links follow whichever domain the editor is opened on, so it works on
         the test domain and the live domain without changes. -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/@sveltia/cms@0/dist/sveltia-cms.js"></script>
    <!-- "Photo" and "Video" buttons in text fields, and live page preview -->
    <script src="./components.js"></script>
    <script src="./preview.js"></script>
    <script>
      CMS.init({
        config: {
          backend: { base_url: location.origin },
          site_url: location.origin,
          display_url: location.origin,
        },
      });
    </script>
  </body>
</html>
